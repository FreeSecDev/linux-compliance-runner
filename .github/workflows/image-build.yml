---
name: image-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Containerfile
      - Containerfile.dockerignore
      - toolbox/**
      - security/**
      - tests/smoke/**
      - tools/image/**
      - tools/security/**
      - Makefile
      - .github/workflows/image-build.yml

permissions: {}

concurrency:
  group: image-build
  cancel-in-progress: false

jobs:
  build:
    name: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    outputs:
      config-digest: ${{ steps.record.outputs.config-digest }}
      archive-sha256: ${{ steps.record.outputs.archive-sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Allow unprivileged user namespaces on this single-use runner for rootless Buildah
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build the checked-out commit with rootless Buildah and export it as an archive
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: make image-build
      - name: Record the archive and require the built commit to be this commit
        id: record
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          record=build/image-build/build.json
          [ "$(jq -er '.commit' "$record")" = "$EXPECTED_COMMIT" ]
          [ "$(jq -er '.built_commit' "$record")" = "$EXPECTED_COMMIT" ]
          config="$(jq -er '.config_digest' "$record")"
          archive="$(jq -er '.archive_sha256' "$record")"
          printf '%s  %s\n' "$archive" build/image-build/image.tar | sha256sum --check --strict -
          {
            printf 'config-digest=%s\n' "$config"
            printf 'archive-sha256=%s\n' "$archive"
          } >> "$GITHUB_OUTPUT"
      - name: Upload the image archive and the build record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-archive
          path: |
            build/image-build/image.tar
            build/image-build/build.json
          if-no-files-found: error
          retention-days: 7

  push:
    name: push
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.record.outputs.reference }}
      digest: ${{ steps.record.outputs.digest }}
      name: ${{ steps.record.outputs.name }}
      release-tag: ${{ steps.record.outputs.release-tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download the image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: image-archive
          path: build/image-build/
      - name: Check the archive against the build record before any registry login
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.build.outputs.archive-sha256 }}
          EXPECTED_CONFIG_DIGEST: ${{ needs.build.outputs.config-digest }}
        run: make image-archive-check
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push the verified archive to GHCR as a candidate and check the pushed digest, config and label
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.build.outputs.archive-sha256 }}
          EXPECTED_CONFIG_DIGEST: ${{ needs.build.outputs.config-digest }}
        run: make image-push
      - name: Record the pushed digest
        id: record
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          record=build/image-push/push.json
          [ "$(jq -er '.commit' "$record")" = "$EXPECTED_COMMIT" ]
          [ "$(jq -er '.built_commit' "$record")" = "$EXPECTED_COMMIT" ]
          reference="$(jq -er '.reference' "$record")"
          digest="$(jq -er '.digest' "$record")"
          name="$(jq -er '.name' "$record")"
          [ "$reference" = "$name@$digest" ]
          [ "$name" = "$(make --no-print-directory -s print-release-repository)" ]
          {
            printf 'reference=%s\n' "$reference"
            printf 'digest=%s\n' "$digest"
            printf 'name=%s\n' "$name"
            printf 'release-tag=%s\n' "$(jq -er '.release_tag' "$record")"
          } >> "$GITHUB_OUTPUT"
          printf '## Candidate image\n\n- %s\n' "$reference" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the push record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-push
          path: build/image-push/push.json
          if-no-files-found: error
          retention-days: 90
      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io

  smoke:
    name: smoke
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Download the image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: image-archive
          path: build/image-build/
      - name: Run the smoke tests against the verified archive in a job without a package token
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.build.outputs.archive-sha256 }}
          EXPECTED_CONFIG_DIGEST: ${{ needs.build.outputs.config-digest }}
        run: make image-smoke-archive

  scan:
    name: scan
    needs: push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Log in to GHCR to read
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Pull the candidate digest and check its revision label
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          IMAGE_REF: ${{ needs.push.outputs.reference }}
        run: make image-pull
      - name: Scan exactly the candidate digest with the pinned Grype and apply the exception gate
        id: scan
        env:
          IMAGE_REF: ${{ needs.push.outputs.reference }}
        run: make image-scan
      - name: Publish the scan summary
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        run: |
          if [ -f build/image-scan/summary.md ]; then
            cat build/image-scan/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Generate the SBOMs of the candidate digest with a read-only token
        env:
          IMAGE_REF: ${{ needs.push.outputs.reference }}
        run: make sbom
      - name: Upload the scan report
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-scan
          path: build/image-scan/
          if-no-files-found: error
          retention-days: 90
      - name: Upload the SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-sbom
          path: build/sbom/
          if-no-files-found: error
          retention-days: 90
      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io

  publish:
    name: publish
    needs: [push, smoke, scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download the SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: image-sbom
          path: build/sbom/
      - name: Check that the SBOMs describe the candidate digest
        env:
          IMAGE_REF: ${{ needs.push.outputs.reference }}
        run: make sbom-check
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Refuse to sign anything if the release tag already exists
        env:
          RELEASE_TAG: ${{ needs.push.outputs.release-tag }}
        run: make release-tag-absent
      - name: Sign the candidate digest with cosign keyless
        env:
          IMAGE_REF: ${{ needs.push.outputs.reference }}
        run: make sign
      - name: Attest the build provenance of the digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ needs.push.outputs.name }}
          subject-digest: ${{ needs.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the SBOM of the digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ needs.push.outputs.name }}
          subject-digest: ${{ needs.push.outputs.digest }}
          sbom-path: build/sbom/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Verify the signature and both attestations of the digest
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ needs.push.outputs.reference }}
        run: make verify-release
      - name: Tag the verified digest as the release
        env:
          IMAGE_REF: ${{ needs.push.outputs.reference }}
          RELEASE_TAG: ${{ needs.push.outputs.release-tag }}
        run: make image-release
      - name: Record the release digest in the job summary
        env:
          RELEASE_REFERENCE: ${{ needs.push.outputs.reference }}
        run: printf '## Release image\n\n- %s\n' "$RELEASE_REFERENCE" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the release record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-release
          path: build/image-release/
          if-no-files-found: error
          retention-days: 90
      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io
